name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # No contents: write in this job. It runs checkout, the build and attestation, and the
  # token that can publish a release is deliberately not in scope while any of that happens.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  # Extra job: this package publishes to npm. Canon compares job step arrays whole, so
  # provenance publish cannot sit on `build`.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: Rethunk-Tech/gh-actions/setup-bun@ed6afe0e127f69c7da2c8178521fa0d049176a00 # v1.36
        with:
          node-version: "26"

      - name: Tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag must match package.json version $version"
            exit 1
          fi

      - name: Build
        run: bun run build

      # A version already on npm (published by hand, or a re-run of this tag) is not an error.
      - name: Publish
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
            exit 0
          fi
          npm publish --provenance --access public

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 brings the annotated tag OBJECT, not just the commit it points at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the GitHub Release from the tag's own annotation
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          subject=$(git tag -l --format='%(contents:subject)' "$TAG")
          body=$(git tag -l --format='%(contents:body)' "$TAG")
          [ -n "$subject" ] || subject=$(git log -1 --format='%s' "$TAG")
          [ -n "$body" ] || body=$(git log -1 --format='%b' "$TAG")
          gh release create "$TAG" \
            --title "$TAG — $subject" \
            --notes "${body:-$subject}" \
            --verify-tag

  move-major:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Move the floating major tag to this release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+)\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "$TAG is not a vN.M release; no floating major to move."
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          newest=$(git tag -l --sort=-v:refname "${major}.*" | grep -E "^${major}\.[0-9]+(\.[0-9]+)?$" | head -1)
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest $major release ($newest); leaving $major where it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "$major -> $TAG" "$TAG^{commit}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --force origin "refs/tags/$major"
